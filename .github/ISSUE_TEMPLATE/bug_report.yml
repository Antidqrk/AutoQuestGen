name: Bug report
description: Report a scanning, progression, preview, artwork, or quest-book problem.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Generator, Minecraft, mod loader, and FTB Quests versions.
      placeholder: "Generator 7.13, Minecraft 1.20.1, Forge, FTB Quests 2001.4.21"
    validations:
      required: true
  - type: input
    id: pack
    attributes:
      label: Modpack
      description: Pack name and roughly how many jars are in mods/.
      placeholder: "All the Mods 9, ~380 jars"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it
      options:
        - AutoQuestGen.exe from Releases
        - python autoquestgen.py from source
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        Paste the relevant part of autoquestgen.log (next to the exe, or in
        %LOCALAPPDATA%\AutoQuestGen). Remove personal paths and credentials.
        Include the seed and settings that reproduce the problem when possible.
      render: text
